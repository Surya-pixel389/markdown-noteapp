spring.application.name=noteapp
spring.port = 8080

#Profile
spring.profiles.active= dev

#H2 database
spring.datasource.url=jdbc:h2:./data/testdb 
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#H2 Web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#Jpa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

#Security
jwt.secret=PRSISUATNGRYAPHA7060029060440644
jwt.expiration=2592000000

#CORS aka cross-origin resource sharing
cors.allowed-origin=https://localhost:3000

#Logging levels
logging.level.root=INFO
logging.level.com.noteapp=DEBUG